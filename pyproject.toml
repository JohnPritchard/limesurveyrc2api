[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limesurveyrc2api"
dynamic = ["version"]
description = "LimeSurvey RC2 API Web Services Client"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Lindsay Stevens", email = "lindsay.stevens.au@gmail.com" },
]
keywords = [
    "api",
    "client",
    "limesurvey",
    "webservice",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/lindsay-stevens"

[tool.hatch.version]
path = "limesurveyrc2api/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/limesurveyrc2api",
]
